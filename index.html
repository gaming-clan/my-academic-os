<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistem akademik 100% lokal për lëndët, notat, detyrat dhe shënimet e studimit, i përshtatur për sistemin arsimor shqiptar." />
    <title>Sistemi Im Akademik</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sistemi Akademik" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem('academic_os_theme') || 'system';
          var selectedVisualTheme = localStorage.getItem('academic_os_visual_theme');
          var visualTheme = selectedVisualTheme;
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var hour = new Date().getHours();
          if (selectedVisualTheme === 'time') {
            visualTheme = hour < 6 || hour >= 21 ? 'midnight' : hour < 11 ? 'paper' : hour < 17 ? 'ocean' : 'sunset';
            isDark = visualTheme === 'midnight';
          } else if (['paper', 'mint', 'rose'].indexOf(visualTheme) !== -1) {
            isDark = false;
          } else if (['ocean', 'lavender', 'sunset', 'midnight'].indexOf(visualTheme) !== -1) {
            isDark = true;
          }
          if (isDark) document.documentElement.classList.add('dark');
          if (['academic', 'ocean', 'lavender', 'sunset', 'midnight', 'paper', 'mint', 'rose'].indexOf(visualTheme) !== -1) {
            document.documentElement.dataset.theme = visualTheme;
          }
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
